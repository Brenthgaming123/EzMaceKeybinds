name: Version Port
description: Request support for another Minecraft version
labels: ["Version Port"]
body:
  - type: input
    id: requested_version
    attributes:
      label: Minecraft version you want
      placeholder: "1.21.4"
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - Quilt
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Before you submit
      options:
        - label: The version I'm requesting is 1.21 or higher (lower versions won't be ported).
          required: true
